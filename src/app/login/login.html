<div class="login-wrap">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Connexion</mat-card-title>
      <mat-card-subtitle>Mini-projet Assignments</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full">
          <mat-label>Identifiant</mat-label>
          <input matInput formControlName="login" autocomplete="username" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full">
          <mat-label>Mot de passe</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </mat-form-field>
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="form.invalid || submitting()"
        >
          @if (submitting()) {
            Connexion…
          } @else {
            Se connecter
          }
        </button>
      </form>
      <p class="hint">Comptes de test après <code>npm run seed:users</code> : <code>user</code> / <code>admin</code> — mot de passe <code>demo123</code></p>
    </mat-card-content>
  </mat-card>
</div>
