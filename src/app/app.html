<mat-toolbar color="primary" class="toolbar">
  <a routerLink="/assignments" class="brand">{{ title }}</a>
  <span class="spacer"></span>
  @if (auth.isLoggedIn()) {
    <span class="user-label">{{ auth.user()?.login }} ({{ auth.user()?.role }})</span>
    <button mat-icon-button type="button" (click)="auth.logout()" aria-label="Déconnexion">
      <mat-icon>logout</mat-icon>
    </button>
  } @else {
    <button mat-button type="button" (click)="goLogin()">Connexion</button>
  }
</mat-toolbar>
<main class="main">
  <router-outlet />
</main>
